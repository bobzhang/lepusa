name: MoonBit
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        moonbit: [latest, pre-release]
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "${{ matrix.moonbit }}"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - run: moon check --deny-warn --target native
      - run: moon fmt --check
      # Existing integration tests require Cocoa/WebKit on the host.
      # Linux retains strict compile coverage; macOS runs the complete suite.
      - if: runner.os == 'macOS'
        run: moon test --target native
